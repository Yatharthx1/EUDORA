name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Deploy Backend to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config lfs.allowincompletepush true
          git lfs install

          git checkout --orphan hf-deploy
          git reset
          git add backend data qwen-orchestrator Dockerfile requirements.txt main.py deploy_app.py indore.pkl indore.graphml README.md .gitattributes .gitignore .dockerignore .env.example
          git commit -m "Deploy Backend to Hugging Face Space (${{ github.sha }})"

          git push --force https://theyath:$HF_TOKEN@huggingface.co/spaces/theyath/eudora hf-deploy:main
